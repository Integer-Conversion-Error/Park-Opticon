version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: parkopticon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkopticon
      POSTGRES_PASSWORD: parkopticon_dev_password
      POSTGRES_DB: parkopticon_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - parkopticon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkopticon -d parkopticon_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkopticon-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Server
      PORT: 8080
      ENV: development
      API_VERSION: v1
      
      # Database - use service name 'postgres' as host
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: parkopticon
      DB_PASSWORD: parkopticon_dev_password
      DB_NAME: parkopticon_db
      DB_SSLMODE: disable
      
      # JWT
      JWT_SECRET: dev_secret_change_in_production_please
      JWT_ACCESS_EXPIRY: 1h
      JWT_REFRESH_EXPIRY: 168h
      
      # AWS (for later)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: parkopticon-photos
      
      # Workers
      ALERT_CHECK_INTERVAL: 30s
      SPOT_EXPIRY_CHECK_INTERVAL: 5m
      
      # CORS - Allow all for development
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOW_CREDENTIALS: "true"
      
      # Logging
      LOG_LEVEL: debug
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parkopticon-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  parkopticon-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
