# Production docker-compose for Ubuntu server
version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: parkopticon-db-prod
    restart: always
    environment:
      POSTGRES_USER: parkopticon
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Set in .env file
      POSTGRES_DB: parkopticon_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - /opt/parkopticon/postgres_data:/var/lib/postgresql/data
    networks:
      - parkopticon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkopticon -d parkopticon_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: parkopticon/backend:latest
    container_name: parkopticon-backend-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: production
      API_VERSION: v1
      
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: parkopticon
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: parkopticon_db
      DB_SSLMODE: disable
      
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: 1h
      JWT_REFRESH_EXPIRY: 168h
      
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      
      ALERT_CHECK_INTERVAL: 30s
      SPOT_EXPIRY_CHECK_INTERVAL: 5m
      
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"
      
      LOG_LEVEL: info
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parkopticon-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  parkopticon-network:
    driver: bridge
