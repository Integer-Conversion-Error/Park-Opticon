services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: parkopticon
      POSTGRES_PASSWORD: ${PARKOPTICON_E2E_DB_PASSWORD:?required}
      POSTGRES_DB: parkopticon_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U parkopticon -d parkopticon_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    restart: on-failure
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: parkopticon
      DB_PASSWORD: ${PARKOPTICON_E2E_DB_PASSWORD:?required}
      DB_NAME: parkopticon_e2e
      DB_SSLMODE: disable
      JWT_SECRET: ${PARKOPTICON_E2E_JWT_SECRET:?required}
      MFA_ENCRYPTION_KEY: ${PARKOPTICON_E2E_MFA_KEY:?required}
      RATE_LIMIT_REQUESTS_PER_MINUTE: 1000
      RATE_LIMIT_AUTH_PER_MINUTE: 1000
      RATE_LIMIT_REPORTS_PER_HOUR: 1000
      EXPO_PUSH_ACCESS_TOKEN: ""
    ports:
      - "${PARKOPTICON_E2E_HOST_IP:?required}:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
